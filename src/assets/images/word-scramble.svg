<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f0f0f0"/>
  <text x="200" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Word Scramble</text>
  
  <!-- Scrambled letters -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="40" height="40" fill="#1976d2" rx="5"/>
    <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle" fill="white">S</text>
    
    <rect x="50" y="0" width="40" height="40" fill="#dc004e" rx="5"/>
    <text x="70" y="25" font-family="Arial" font-size="20" text-anchor="middle" fill="white">C</text>
    
    <rect x="100" y="0" width="40" height="40" fill="#1976d2" rx="5"/>
    <text x="120" y="25" font-family="Arial" font-size="20" text-anchor="middle" fill="white">R</text>
    
    <rect x="150" y="0" width="40" height="40" fill="#dc004e" rx="5"/>
    <text x="170" y="25" font-family="Arial" font-size="20" text-anchor="middle" fill="white">A</text>
    
    <rect x="200" y="0" width="40" height="40" fill="#1976d2" rx="5"/>
    <text x="220" y="25" font-family="Arial" font-size="20" text-anchor="middle" fill="white">M</text>
  </g>
  
  <!-- Arrow pointing down -->
  <path d="M200,150 L190,160 L210,160 Z" fill="#333"/>
</svg> 