<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#f0f0f0"/>
  <text x="200" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Tower of Hanoi</text>
  
  <!-- Base -->
  <rect x="50" y="180" width="300" height="10" fill="#333"/>
  
  <!-- Poles -->
  <line x1="100" y1="180" x2="100" y2="100" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="180" x2="200" y2="100" stroke="#333" stroke-width="4"/>
  <line x1="300" y1="180" x2="300" y2="100" stroke="#333" stroke-width="4"/>
  
  <!-- Disks on first pole -->
  <rect x="70" y="160" width="60" height="20" fill="#1976d2" rx="5"/>
  <rect x="60" y="140" width="80" height="20" fill="#1976d2" rx="5"/>
  <rect x="50" y="120" width="100" height="20" fill="#1976d2" rx="5"/>
  
  <!-- Empty poles -->
  <circle cx="200" cy="180" r="5" fill="#333"/>
  <circle cx="300" cy="180" r="5" fill="#333"/>
</svg> 